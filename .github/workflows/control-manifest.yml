name: Control manifest validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authoritative planning bundle
        run: python tools/validate_execution_manifest.py
      - name: Validate control checkpoint and selector
        run: python tools/validate_control_state.py
      - name: Verify actual selector CLI output
        run: |
          python scripts/select_batch.py > /tmp/control-selection.json
          python -c 'import json; s=json.load(open("/tmp/control-selection.json")); assert [p["id"] for p in s["batch"]] == list(range(21,41)); assert s["batch_count"] == 20; print("Selector CLI: IDs21-40, count20")'
      - name: Validate historical report without preparing delivery
        run: python tools/daily_report.py --validate-history
      - name: Prove generated pending evidence cannot count complete
        run: |
          python tools/completion_evidence.py --generate-pending 21 > /tmp/pending-evidence.json
          if python tools/completion_evidence.py --validate /tmp/pending-evidence.json; then
            exit 1
          fi
      - name: Validate non-authoritative tomorrow proposal
        run: |
          python tools/propose_batch.py --root . --now-ist 2026-10-11T04:00:00+05:30 --owner dry-run-20261011-ids021-040 > /tmp/batch-proposal.json
          python -c 'import json; p=json.load(open("/tmp/batch-proposal.json")); assert p["planningOnly"] and p["actualLeaseUnchanged"]; assert p["proposal"]["state"]["originalSelectedIDs"] == list(range(21,41)); print("Dry-run proposal valid; no lease acquired"); print("BATCH_PROPOSAL_JSON="+json.dumps(p,sort_keys=True))'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
