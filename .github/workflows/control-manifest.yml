name: Control manifest validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authoritative planning bundle
        run: python tools/validate_execution_manifest.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
