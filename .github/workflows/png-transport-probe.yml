name: Read-only PNG transport probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/png-transport-probe.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read immutable public blob and validate original bytes
        run: |
          python - <<'PY'
          import base64,hashlib,importlib.util,json,urllib.request
          from pathlib import Path
          source="OpenMakerProjects/smart-entryway-adaptive-scheduling"
          sha="9e086a0c5bb8258e4d4f1ad89539145ad141a669"
          request=urllib.request.Request("https://api.github.com/repos/"+source+"/git/blobs/"+sha,
              headers={"Accept":"application/vnd.github+json","User-Agent":"OpenMakerProjects-read-only-PNG-validation"})
          with urllib.request.urlopen(request,timeout=60) as response:
              blob=json.load(response)
          assert blob["sha"]==sha and blob["encoding"]=="base64" and blob["size"]==1857386
          encoded="".join(blob["content"].splitlines())
          data=base64.b64decode(encoded,validate=True)
          assert base64.b64encode(data).decode()==encoded and len(data)==1857386
          assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==sha
          spec=importlib.util.spec_from_file_location("strict",Path("templates/image-transport/decode_project_image.py"))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          dimensions=module.validate_png(data)
          print("PNG_PROBE_JSON="+json.dumps({"source":source,"blobSHA":sha,"bytes":len(data),"dimensions":dimensions,
              "sha256":hashlib.sha256(data).hexdigest(),"signatureChunksCRCPixelStreamCredentials":"passed"}))
          # Public existing image only; no credentials/URLs are printed. Bounded log records allow a
          # text-only cloud connector to retrieve unchanged bytes without a scratch executor.
          for index,start in enumerate(range(0,len(encoded),16000)):
              print("PNG_PROBE_B64_"+str(index).zfill(3)+"="+encoded[start:start+16000])
          PY
